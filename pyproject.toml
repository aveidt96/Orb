[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "project-orb"
version = "0.5.0"
description = "Orb — OpenCV 5.0 Agentic Vision & Creative Intelligence Platform (AWS S3 + Graviton Arm64)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pytest>=8.0",
    "openai>=1.40",
    "google-genai>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "Pillow>=11.0",
    "eth-account>=0.13,<1",
    "psycopg[binary]>=3.2,<4",
    "opencv-python-headless>=4.10.0",
    "numpy>=1.26.0",
    "boto3>=1.35.0",
    "mangum>=0.19.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
